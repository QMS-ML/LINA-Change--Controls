<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Tracker | LINA QMS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0f4c81;--blue-dark:#0a3459;--blue-deep:#06223d;
    --blue-light:#e8f0f8;--blue-mid:#b5cde3;--teal:#128ea2;
    --text:#1a2433;--text-muted:#5a6b80;--border:#d6e1ec;
    --white:#ffffff;
    --red:#c0392b;--red-light:#fdf0ef;--green:#1a7a4a;--green-light:#eaf5ef;
    --amber:#9a5b00;--amber-light:#fff4e0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;
       background-color:#eef4f8;background-image:radial-gradient(rgba(15,76,129,0.10) 1px,transparent 1px);background-size:22px 22px;overflow-x:hidden;}
  button{font-family:inherit;}

  /* Top bar */
  header{background:var(--white);height:68px;padding:0 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(15,76,129,0.06);flex-shrink:0;position:relative;z-index:2;}
  .hbtn{height:36px;border-radius:9px;padding:0 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer;background:var(--blue);border:1.5px solid var(--blue);color:#fff;transition:background .12s,border-color .12s;}
  .hbtn:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
  .btn-home{justify-self:start;}
  .btn-logout{justify-self:end;}
  .brand-logo{height:44px;width:auto;display:block;}

  /* Background shapes */
  .bg-shape{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
  .bg-a{width:620px;height:620px;left:-240px;bottom:-260px;background:rgba(18,142,162,0.10);}
  .bg-b{width:420px;height:420px;right:-140px;top:60px;border:56px solid rgba(15,76,129,0.06);}
  .bg-c{width:160px;height:160px;right:22%;bottom:-60px;background:rgba(18,142,162,0.08);}

  .content{flex:1;position:relative;z-index:1;padding:30px 32px 48px;}
  .wrap{max-width:1000px;margin:0 auto;}

  /* Blue title bar */
  .title-bar{background:linear-gradient(135deg,var(--blue-deep),var(--blue-dark),var(--blue));color:#fff;border-radius:14px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;box-shadow:0 8px 28px rgba(15,76,129,0.18);}
  .title-bar h1{font-size:20px;font-weight:700;letter-spacing:-0.3px;}
  .title-bar p{font-size:13px;color:rgba(255,255,255,0.7);margin-top:3px;}
  .tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tab{height:36px;border-radius:9px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.85);display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s;}
  .tab:hover{background:rgba(255,255,255,0.2);color:#fff;}
  .tab.on{background:#fff;color:var(--blue-dark);border-color:#fff;}
  .tab .n{font-family:'DM Mono',monospace;font-size:11px;border-radius:100px;padding:1px 8px;background:rgba(255,255,255,0.18);}
  .tab.on .n{background:var(--blue-light);color:var(--blue-dark);}
  .btn-refresh{height:36px;border-radius:9px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,0.28);color:#fff;}
  .btn-refresh:hover{background:rgba(255,255,255,0.15);}

  .alert{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;font-weight:500;display:none;}
  .alert.show{display:block;}
  .alert.success{background:var(--green-light);border:1px solid #a0d4b8;color:var(--green);}
  .alert.error{background:var(--red-light);border:1px solid #f0b8b0;color:var(--red);}

  /* Tables */
  .tbl-card{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 14px rgba(15,76,129,0.06);overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:#f5f8fb;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding:12px 18px;border-bottom:1px solid var(--border);}
  tbody td{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafcfe;}
  th.r,td.r{text-align:right;}
  .cc{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500;color:var(--blue);white-space:nowrap;}
  .sub{display:block;font-size:11.5px;color:var(--text-muted);margin-top:3px;font-family:'DM Sans',sans-serif;}
  .ttl{font-weight:600;line-height:1.35;}
  .dept-chip{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:var(--blue-dark);background:var(--blue-light);border-radius:6px;padding:2px 8px;}
  .btn{height:36px;border-radius:9px;font-size:13px;font-weight:700;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:none;white-space:nowrap;transition:background .12s;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:#0d7486;}
  .btn-ghost{background:var(--white);color:var(--blue);border:1.5px solid var(--blue-mid);}
  .btn-ghost:hover{background:var(--blue-light);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Progress bar column */
  .prog{display:flex;align-items:center;gap:10px;min-width:180px;}
  .bar{flex:1;height:8px;border-radius:8px;background:#e9eff5;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:8px;background:var(--teal);}
  .bar i.full{background:var(--green);}
  .prog b{font-family:'DM Mono',monospace;font-size:12.5px;font-weight:500;white-space:nowrap;}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;}
  .st.Pending{background:var(--amber-light);color:var(--amber);}
  .st.In{background:var(--blue-light);color:var(--blue);}
  .st.Completed{background:var(--green-light);color:var(--green);}

  .note{font-size:12.5px;color:var(--text-muted);margin:10px 4px 0;}
  .state{background:var(--white);border:1.5px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;color:var(--text-muted);font-size:14px;}
  .state b{display:block;color:var(--blue-deep);font-size:16px;margin-bottom:4px;}
  .skeleton{height:62px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#f1f5f9 25%,#f8fafc 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;}
  @keyframes shimmer{to{background-position:-200% 0;}}

  /* Views */
  .view{display:none;}
  .view.active{display:block;animation:fadeUp .22s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .btn-backlist{background:none;border:none;color:var(--blue);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:14px;padding:4px 0;}
  .btn-backlist:hover{text-decoration:underline;}

  /* Detail card */
  .rv{background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(15,76,129,0.12);overflow:hidden;}
  .rv-head{background:linear-gradient(135deg,var(--blue-deep),var(--blue));padding:22px 26px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .rv-label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:1px;}
  .rv-no{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;letter-spacing:1px;margin-top:2px;}
  .rv-title{font-size:16px;font-weight:600;margin-top:6px;line-height:1.4;}
  .rv-prog{min-width:220px;}
  .rv-prog .bar{background:rgba(255,255,255,0.2);}
  .rv-prog small{display:block;font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:6px;}
  .rv-body{padding:24px 26px;}
  .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#f7fafc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:22px;}
  .meta-grid span{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .meta-grid b{font-size:14px;font-weight:600;word-break:break-word;}
  .meta-grid .mono{font-family:'DM Mono',monospace;font-weight:500;}
  .sec{margin-bottom:18px;}
  .sec h3{font-size:12px;font-weight:700;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
  .sec p{font-size:14px;line-height:1.6;white-space:pre-wrap;border:1px solid var(--border);border-left:3px solid var(--blue-mid);border-radius:0;padding:12px 14px;}
  .decide{border-top:1px solid var(--border);padding:20px 26px;background:#fafcfe;}
  .decide > label{display:block;font-size:13px;font-weight:600;margin-bottom:10px;}
  .decide > label i{font-style:normal;font-weight:400;color:var(--text-muted);}

  /* Department selection */
  .dept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .dept{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--white);font-size:13px;transition:border-color .15s,background .15s;}
  .dept:hover{border-color:var(--blue-mid);}
  .dept input{margin-top:2px;width:16px;height:16px;accent-color:var(--blue);flex-shrink:0;}
  .dept.on{border-color:var(--blue);background:var(--blue-light);}
  .dept.locked{cursor:default;background:#f7fafc;}
  .dept.nomail{opacity:.55;cursor:not-allowed;}
  .dept b{font-size:14px;font-weight:600;display:block;}
  .dept small{display:block;font-size:12px;color:var(--text-muted);margin-top:3px;}
  .sel-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .sel-count{font-size:13px;color:var(--text-muted);}

  /* Impacts table */
  .imp{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;}
  .imp.yes{background:var(--amber-light);color:var(--amber);}
  .imp.no{background:var(--green-light);color:var(--green);}
  .imp.wait{background:#eef2f6;color:var(--text-muted);}
  td.cm{white-space:pre-wrap;line-height:1.5;color:var(--text);}
  .imp-actions{display:flex;justify-content:flex-end;margin-top:16px;}


  /* QC form */
  .part-head{background:var(--blue-light);border:1px solid var(--blue-mid);border-radius:10px;padding:12px 16px;margin-bottom:16px;}
  .part-head b{display:block;font-size:14px;color:var(--blue-deep);}
  .part-head span{font-size:12.5px;color:var(--text-muted);}
  .area{display:grid;grid-template-columns:34px 260px 1fr;gap:12px;border-top:1px solid var(--border);padding:14px 0;}
  .area:first-of-type{border-top:none;}
  .area .lt,.cat .lt{font-family:'DM Mono',monospace;font-size:13px;color:var(--blue);font-weight:500;padding-top:2px;}
  .area .q b,.cat .q b{display:block;font-size:13.5px;}
  .area .q small,.cat .q small{display:block;font-size:12px;color:var(--text-muted);line-height:1.45;margin-top:3px;}
  .area textarea{width:100%;min-height:70px;border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;outline:none;}
  .area textarea:focus{border-color:var(--blue);}
  .area textarea.invalid{border-color:var(--red);background:var(--red-light);}
  .area textarea:disabled{background:#f7fafc;color:var(--text);}
  .na{margin-top:6px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--white);color:var(--text-muted);border-radius:6px;padding:3px 10px;cursor:pointer;}
  .na:hover{border-color:var(--blue-mid);color:var(--blue);}
  .cat-wrap{margin-top:22px;}
  .cat{display:grid;grid-template-columns:34px 260px 1fr;gap:12px;align-items:center;border-top:1px solid var(--border);padding:12px 0;}
  .seg{justify-self:start;display:inline-flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white);}
  .seg.invalid{border-color:var(--red);}
  .seg label{display:block;margin:0;cursor:pointer;}
  .seg input{position:absolute;opacity:0;pointer-events:none;}
  .seg span{display:block;padding:9px 22px;font-size:13.5px;font-weight:600;color:var(--text-muted);border-left:1px solid var(--border);transition:background .12s,color .12s;}
  .seg label:first-child span{border-left:none;}
  .seg input:checked + span{background:var(--blue);color:#fff;}
  .seg input:disabled + span{cursor:default;}
  .seg input:disabled:checked + span{background:var(--blue-dark);}
  .chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin:4px 4px 0 0;background:var(--blue-light);color:var(--blue-dark);}
  .chip.major{background:var(--red-light);color:var(--red);}
  .chip.risk{background:var(--amber-light);color:var(--amber);}
  .decide-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}
  .btn-draft{background:var(--white);color:var(--blue);border:1.5px solid var(--blue-mid);}
  .btn-draft:hover{background:var(--blue-light);}
  .btn-draft .spinner{border-color:rgba(15,76,129,.25);border-top-color:var(--blue);}
  .btn-approve{background:var(--green);color:#fff;}
  .btn-approve:hover{background:#156a3f;}
  .st.Draft{background:var(--amber-light);color:var(--amber);}
  .st.New{background:#eef2f6;color:var(--text-muted);}

  /* Collapsible detail sections */
  .fold{border:1px solid var(--border);border-radius:12px;background:var(--white);margin-bottom:10px;overflow:hidden;}
  .fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;font-size:13px;font-weight:700;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.7px;background:#f7fafc;}
  .fold summary::-webkit-details-marker{display:none;}
  .fold summary::after{content:'Show ▾';font-size:11.5px;font-weight:600;color:var(--blue);text-transform:none;letter-spacing:0;}
  .fold[open] summary::after{content:'Hide ▴';}
  .fold[open] summary{border-bottom:1px solid var(--border);}
  .fold .fb{padding:16px 18px;}
  .fold .fb .meta-grid{margin-bottom:14px;}
  .fold .sec{margin-bottom:12px;}
  .fold .sec:last-child{margin-bottom:0;}
  .fold-tools{display:flex;justify-content:flex-end;gap:12px;margin:-4px 0 10px;}
  .link{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 0;}
  .link:hover{text-decoration:underline;}
  .qa-row{display:grid;grid-template-columns:28px 230px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;}
  .qa-row:first-child{border-top:none;}
  .qa-row .lt{font-family:'DM Mono',monospace;color:var(--blue);}
  .qa-row b{font-weight:600;}
  .qa-row div:last-child{white-space:pre-wrap;}

  /* Action item form */
  .ai-head,.ai{display:grid;grid-template-columns:170px minmax(0,1fr) 200px 160px 38px;gap:10px;align-items:start;}
  .ai-head{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;padding:0 0 8px;border-bottom:1px solid var(--border);}
  .ai{padding:10px 0;border-bottom:1px solid var(--border);}
  .ai .no{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--blue);padding-top:11px;word-break:break-all;}
  .ai .no small{display:block;font-family:'DM Sans',sans-serif;font-size:10.5px;color:var(--text-muted);}
  .ai textarea,.ai input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13.5px;outline:none;background:var(--white);color:var(--text);}
  .ai textarea{min-height:42px;resize:vertical;}
  .ai input{height:40px;}
  .ai textarea:focus,.ai input:focus{border-color:var(--blue);}
  .ai .invalid{border-color:var(--red);background:var(--red-light);}
  .ai textarea:disabled,.ai input:disabled{background:#f7fafc;}
  .rm{width:38px;height:40px;border:1.5px solid var(--border);border-radius:8px;background:var(--white);color:var(--red);font-size:15px;cursor:pointer;}
  .rm:hover{background:var(--red-light);border-color:#f0b8b0;}
  .btn-add{margin-top:12px;height:38px;border:1.5px dashed var(--blue-mid);border-radius:9px;background:var(--white);color:var(--blue);font-size:13.5px;font-weight:700;padding:0 16px;cursor:pointer;}
  .btn-add:hover{background:var(--blue-light);}
  .ai-empty{padding:18px;text-align:center;color:var(--text-muted);font-size:13.5px;border-bottom:1px solid var(--border);}
  .st.Submitted{background:var(--green-light);color:var(--green);}

  .ai-tbl td{vertical-align:top;}
  .pdf-out{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pdf-out a{font-size:13px;font-weight:700;text-decoration:none;border-radius:9px;padding:9px 14px;border:1.5px solid var(--blue-mid);color:var(--blue);}
  .pdf-out a.pdf{background:var(--blue);border-color:var(--blue);color:#fff;}
  .gen-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .gen-bar p{font-size:13px;color:var(--text-muted);max-width:520px;line-height:1.5;}
  .btn-pdf{background:var(--blue);color:#fff;height:42px;padding:0 20px;font-size:14px;}
  .btn-pdf:hover{background:var(--blue-dark);}

  .ov{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--red-light);color:var(--red);white-space:nowrap;}
  .muted{color:var(--text-muted);font-size:12.5px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;}
  .pill.Open{background:#eef2f6;color:var(--text-muted);}
  .pill.InProgress{background:var(--amber-light);color:var(--amber);}
  .pill.Extended{background:var(--blue-light);color:var(--blue);}
  .pill.Completed{background:var(--green-light);color:var(--green);}
  .pill.Cancelled{background:#f1f1f4;color:#6b6b7b;text-decoration:line-through;}
  .it{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--white);}
  .it.overdue{border-left:4px solid var(--red);}
  .it.done{background:#fafcfd;}
  .it-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .it-top .cc{margin-right:4px;}
  .it-top .sp{flex:1;}
  .it-desc{font-size:14px;margin:10px 0 12px;white-space:pre-wrap;line-height:1.5;}
  .it-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:13px;}
  .it-meta span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
  .ext{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .it-rem{margin-top:12px;padding:10px 12px;border-radius:8px;background:#f5f8fb;font-size:13px;white-space:pre-wrap;}
  .it-rem small{display:block;color:var(--text-muted);margin-top:4px;}
  .upd{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:none;}
  .upd.show{display:block;}
  .upd .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .upd label.t{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
  .upd textarea,.upd input[type=text],.upd input[type=date]{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13.5px;outline:none;background:var(--white);color:var(--text);}
  .upd textarea{min-height:64px;resize:vertical;}
  .upd textarea:focus,.upd input:focus{border-color:var(--blue);}
  .upd .invalid{border-color:var(--red)!important;background:var(--red-light)!important;}
  .upd-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}
  .hist{margin-top:10px;}
  .hist summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue);list-style:none;}
  .hist summary::-webkit-details-marker{display:none;}
  .hist ol{list-style:none;margin-top:8px;border-left:2px solid var(--border);padding-left:14px;}
  .hist li{font-size:12.5px;margin-bottom:8px;position:relative;}
  .hist li::before{content:'';position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--blue-mid);}
  .hist li .w{color:var(--text-muted);}
  .rq{color:var(--red);}
  .sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .filters label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .filters select,.filters input{height:38px;min-width:200px;border:1.5px solid var(--border);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13.5px;background:var(--white);color:var(--text);outline:none;}
  .filters select:focus,.filters input:focus{border-color:var(--blue);}
  .scope-note{font-size:13px;color:var(--text-muted);background:var(--white);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:9px 14px;margin:0 0 14px;}
  .src-warn{font-size:12.5px;color:#8a5a00;background:#fff6e0;border:1px solid #f3dca3;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:none;}
  .src-warn.show{display:block;}
  .muted{color:var(--text-muted);font-size:13px;}
  .pg-list{display:flex;flex-direction:column;gap:6px;}
  .pg{background:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 4px rgba(15,76,129,.05);}
  .pg.open{border-color:var(--blue-mid);box-shadow:0 4px 18px rgba(15,76,129,.10);}
  .pg-row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 250px 170px 16px;gap:16px;align-items:center;padding:9px 18px;cursor:pointer;}
  .pg-row:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:10px;}
  .pg-id b{display:block;font-family:'DM Mono',monospace;font-weight:500;font-size:13.5px;color:var(--blue);}
  .pg-id small,.pg-ttl small{display:block;font-size:11px;color:var(--text-muted);}
  .pg-ttl b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pg-steps{display:flex;align-items:center;}
  .pg-steps .dot{width:12px;height:12px;border-radius:50%;background:#e2e8ef;border:2px solid #e2e8ef;flex:none;}
  .pg-steps .dot.done{background:#1a7a4a;border-color:#1a7a4a;}
  .pg-steps .dot.current{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,76,129,.15);}
  .pg-steps .dot.stop{background:#c0392b;border-color:#c0392b;}
  .pg-steps .ln{flex:1;height:2px;background:#e2e8ef;min-width:8px;}
  .pg-steps .ln.done{background:#1a7a4a;}
  .pg-stage{justify-self:start;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--blue-light);color:var(--blue);white-space:nowrap;}
  .pg-stage.done{background:#e6f6ec;color:#1a7a4a;}
  .pg-stage.stop{background:#fdf0ef;color:#c0392b;}
  .chev{color:var(--text-muted);font-size:12px;}
  .pg-detail{border-top:1px solid var(--border);padding:16px 18px 18px;}
  .pg-detail h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:18px 0 8px;}
  .stepper{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;}
  .stepper .st{position:relative;padding-top:20px;font-size:12px;}
  .stepper .st i{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:#e2e8ef;}
  .stepper .st::before{content:'';position:absolute;top:6px;left:16px;right:-4px;height:2px;background:#e2e8ef;}
  .stepper .st:last-child::before{display:none;}
  .stepper .st.done i{background:#1a7a4a;} .stepper .st.done::before{background:#1a7a4a;}
  .stepper .st.current i{background:#fff;border:3px solid var(--blue);width:8px;height:8px;}
  .stepper .st.stop i{background:#c0392b;}
  .stepper b{display:block;font-size:12px;line-height:1.3;}
  .stepper span{display:block;color:var(--text-muted);}
  .stepper small{display:block;color:var(--text-muted);font-size:11px;}
  .tl{list-style:none;border-left:2px solid var(--border);margin-left:6px;padding-left:16px;}
  .tl li{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:5px 0;font-size:13px;}
  .tl li::before{content:'';position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--blue-mid);}
  .tl .when{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted);}
  .tl .who{color:var(--text-muted);}
  .tl small{display:block;color:var(--text-muted);font-size:12px;white-space:pre-wrap;}
  .acts div{font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
  .acts small{display:block;color:var(--text-muted);font-size:11.5px;}
  .pill-s{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 8px;background:#eef2f6;color:var(--text-muted);}
  .pill-s.Completed{background:#e6f6ec;color:#1a7a4a;} .pill-s.Extended{background:var(--blue-light);color:var(--blue);}
  .pill-s.InProgress{background:#fff4e0;color:#9a5b00;} .pill-s.Cancelled{text-decoration:line-through;}
  @media (max-width:760px){
    .pg-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'id st' 'tt tt' 'sp sp';row-gap:6px;}
    .pg-id{grid-area:id}.pg-stage{grid-area:st}.pg-ttl{grid-area:tt}.pg-steps{grid-area:sp}.chev{display:none}
    .stepper{grid-template-columns:1fr 1fr;row-gap:12px}
    .tl li{grid-template-columns:1fr}
    .filters select,.filters input{min-width:0;width:100%}
    .filters label{flex:1 1 140px}
    .it-meta{grid-template-columns:1fr 1fr;}
    .upd .row{grid-template-columns:1fr;}
    .ai-head{display:none;}
    .ai{grid-template-columns:1fr 38px;}
    .ai .no{grid-column:1/-1;padding-top:0;}
    .ai .rmw{grid-row:1;grid-column:2;}
    .qa-row{grid-template-columns:24px 1fr;}
    .qa-row div:last-child{grid-column:1/-1;}
    .area,.cat{grid-template-columns:28px 1fr;}
    .area .ans,.cat .seg{grid-column:1/-1;}
    header{padding:0 12px;height:60px;}
    .hbtn{padding:0 11px;}
    .brand-logo{height:34px;}
    .content{padding:22px 14px 40px;}
    .meta-grid{grid-template-columns:1fr 1fr;}
    .dept-grid{grid-template-columns:1fr;}
    /* tables become stacked cards */
    table.stack thead{display:none;}
    table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%;}
    table.stack tr{border-bottom:1px solid var(--border);padding:12px 16px;}
    table.stack td{border:none;padding:4px 0;}
    table.stack td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
    table.stack td.r{text-align:left;padding-top:8px;}
    table.stack td.r .btn{width:100%;justify-content:center;}
  }
</style>

<div class="content">
  <div class="wrap">
    <div class="title-bar">
      <div>
        <h1>Track My CC – Change Control Tracker</h1>
        <p>Where each change control is in the process. Click a row to see its full history.</p>
      </div>
      <div class="tb-actions">
        <button class="tab on" data-st="active" onclick="setState('active')">In progress <span class="n" id="nActive">–</span></button>
        <button class="tab" data-st="done" onclick="setState('done')">Completed <span class="n" id="nDone">–</span></button>
        <button class="tab" data-st="stop" onclick="setState('stop')">Closed / rejected <span class="n" id="nStop">–</span></button>
        <button class="btn-refresh" onclick="load()">↻ Refresh</button>
      </div>

      <label>Search<input type="search" id="fSearch" placeholder="CC No. or title" oninput="render()"></label>

      <label>Current step<select id="fStep" onchange="render()"><option value="">Any step</option></select></label>

<script>
  /* ====== CONFIGURATION (same script URLs as the other pages) ====== */
  const CC_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbwsyAQt_LH8JvMbMw-p8Dw_0GqtDCaTK0050HhYW7db3GGamA6zsVlbbJOMnOvKzJyU/exec';
  const IA_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbzMsZfkIgGU0diElNN8J--9pRF87NALdf7HTA2xYjQeIZpa9KDYtg85o2xczJuafohz/exec';
  const QIA_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYXGffEvRt4eS7jkIB6xoxRBhE_zPhX4fbXlcGffaMyfDowzSbaC0QG7sVn7HPBEZS/exec';
  const AP_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbxtLBLDTvxy0hGPMyvseMy8wYBnsbzus9MnDR_a08Xc1J0ngJ4s744HLIdE26q7MrYT/exec';
  const AIS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcwP5TwD4Dr00KwNZ23D1PrEXmGSu2CvOxgljVlmu9BFUEdU9yVHREGXr1xy4pRA1HKw/exec';
  const HOME_PAGE  = 'HOME.html';
  const LOGIN_PAGE = 'index.html';

  /* ====== Shared: load all QMS data, build progress steps + audit events ====== */
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const K = v => String(v ?? '').trim();
  const FINAL = ['Completed', 'Cancelled'];
  const toDate = v => {
    if (!v) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)){ const p = v.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
    const d = new Date(v); return isNaN(d) ? null : d;
  };
  const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : ''; };
  const fmtDT = v => { const d = toDate(v); return d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + (/^\d{4}-\d{2}-\d{2}$/.test(v) ? '' : ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})) : ''; };

  $('btnHome').href = HOME_PAGE;
  function logout(){ try { sessionStorage.removeItem('lina_user'); } catch (_) {} location.replace(LOGIN_PAGE); }

  async function callScript(url, payload){
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('Server error (' + res.status + ').');
    const r = await res.json();
    if (!r.success) throw new Error(r.message || 'Error');
    return r;
  }

  // Load every script; a failing one is reported, the rest still shown
  async function loadQMS(){
    const srcs = [
      ['Change Control',       CC_SCRIPT_URL,  'listCC'],
      ['Impact Assessment',    IA_SCRIPT_URL,  'listIA'],
      ['QC Impact Assessment', QIA_SCRIPT_URL, 'listQIA'],
      ['Action Plan',          AP_SCRIPT_URL,  'listAP'],
      ['Action Item Status',   AIS_SCRIPT_URL, 'listAIS']
    ];
    const res = await Promise.allSettled(srcs.map(s => callScript(s[1], { action: s[2] })));
    const failed = res.map((r, i) => r.status === 'rejected' ? srcs[i][0] : null).filter(Boolean);
    if (res[0].status === 'rejected') throw new Error('Could not load change controls: ' + res[0].reason.message);
    const items = i => res[i].status === 'fulfilled' ? (res[i].value.items || []) : [];
    const ia = {}, qia = {}, ap = {}, ais = {};
    items(1).forEach(x => ia[K(x.ccNo)] = x);
    items(2).forEach(x => qia[K(x.ccNo)] = x);
    items(3).forEach(x => ap[K(x.ccNo)] = x);
    items(4).forEach(x => ais[K(x.no)] = x);
    const ccs = items(0).map(c => {
      const k = K(c.ccNo), p = ap[k], reg = !!p && ['Registered', 'Submitted'].includes(K(p.status));
      const acts = p ? (p.items || []).map(x => {
        const s = ais[K(x.no)] || {};
        return { ...x, status: s.status || 'Open', target: s.revisedTargetDate || x.targetDate,
                 completionDate: s.completionDate || '', history: s.history || [] };
      }) : [];
      return { ...c, ccNo: k, dept: K(c.department) || '—', ia: ia[k] || null, qia: qia[k] || null, plan: p || null, planReg: reg, acts };
    });
    ccs.forEach(c => { c.steps = stepsOf(c); c.events = eventsOf(c); });
    return { ccs, failed, loadedAt: new Date() };
  }

  // Process steps for one CC: state = done | current | todo | stop
  const STEP_NAMES = ['Registered', 'Initial approval', 'Department IA', 'QC impact assessment', 'Action plan', 'Final approval', 'Implementation', 'Completed'];
  function stepsOf(c){
    const st = K(c.status), fd = K(c.finalDecision);
    const iaDone = c.ia && K(c.ia.status) === 'Completed', qDone = c.qia && K(c.qia.status) === 'Completed';
    const actsDone = c.acts.length > 0 && c.acts.every(a => FINAL.includes(a.status));
    const lastAct = c.acts.map(a => a.completionDate).filter(Boolean).sort().pop() || '';
    const s = [
      { done: true, date: c.dateInitiated, note: c.revision ? 'Rev ' + c.revision : '' },
      { done: st === 'Approved', stop: st === 'Rejected', wait: st === 'Returned' ? 'Returned for correction' : '',
        date: st === 'Approved' ? c.approvedOn : st === 'Rejected' ? c.rejectedOn : st === 'Returned' ? c.returnedOn : '', note: c.reviewedBy || '' },
      { done: iaDone, date: iaDone ? c.ia.completedOn : '', note: c.ia ? (c.ia.commented || 0) + '/' + (c.ia.total || 0) + ' departments' : '' },
      { done: qDone, date: qDone ? c.qia.completedOn : '', note: c.qia && c.qia.assessedBy ? c.qia.assessedBy : '' },
      { done: c.planReg, date: c.planReg ? c.plan.submittedOn : '', note: c.plan ? (c.plan.items || []).length + ' items' : '' },
      { done: fd === 'Approved', stop: fd === 'Not Approved', date: fd ? c.finalOn : '', note: c.finalBy || '' },
      { done: actsDone, date: actsDone ? lastAct : '', note: c.acts.length ? c.acts.filter(a => FINAL.includes(a.status)).length + '/' + c.acts.length + ' items done' : '' },
      { done: actsDone && fd === 'Approved', date: actsDone && fd === 'Approved' ? lastAct : '' }
    ];
    let current = -1, stopped = -1;
    for (let i = 0; i < s.length; i++){
      if (s[i].stop){ stopped = i; break; }
      if (!s[i].done){ current = i; break; }
    }
    return s.map((x, i) => ({ name: STEP_NAMES[i], date: x.date || '', note: x.wait || x.note || '',
      state: stopped > -1 ? (i < stopped ? 'done' : i === stopped ? 'stop' : 'todo')
           : current === -1 ? 'done' : (i < current ? 'done' : i === current ? 'current' : 'todo') }));
  }
  function stageText(c){
    const stop = c.steps.find(s => s.state === 'stop');
    if (stop) return stop.name === 'Final approval' ? 'Not approved' : 'Rejected';
    const cur = c.steps.find(s => s.state === 'current');
    if (!cur) return 'Completed';
    if (cur.name === 'Initial approval' && K(c.status) === 'Returned') return 'Returned for correction';
    return cur.name;
  }

  // Audit events for one CC: { on, ccNo, module, action, by, details }
  function eventsOf(c){
    const E = [], add = (on, module, action, by, details) => { if (on) E.push({ on, ccNo: c.ccNo, title: c.title || '', module, action, by: by || '', details: details || '' }); };
    add(c.dateInitiated, 'Change Control', 'Registered', c.initiatedBy || c.initiator,
        [c.title, c.department, c.changeCategory].filter(Boolean).join(' · '));
    add(c.returnedOn,    'Initial Approval', 'Returned for correction', c.reviewedBy, c.status === 'Returned' ? c.comments : '');
    add(c.resubmittedOn, 'Change Control', 'Corrected & resubmitted' + (c.revision ? ' (Rev ' + c.revision + ')' : ''), c.initiatedBy || c.initiator, '');
    add(c.approvedOn,    'Initial Approval', 'Approved', c.reviewedBy, c.status === 'Approved' ? c.comments : '');
    add(c.rejectedOn,    'Initial Approval', 'Rejected', c.reviewedBy, c.status === 'Rejected' ? c.comments : '');
    if (c.ia){
      const deps = (c.ia.departments || []);
      add(c.ia.assignedOn, 'Impact Assessment', 'Departments selected', c.ia.assignedBy || (deps[0] && deps[0].assignedBy),
          deps.map(d => d.department).join(', '));
      deps.forEach(d => add(d.on, 'Impact Assessment', 'Comment – ' + d.department, d.by, [d.impact, d.comment].filter(Boolean).join(': ')));
      add(c.ia.completedOn, 'Impact Assessment', 'All departments commented', '', '');
    }
    if (c.qia){
      add(c.qia.startedOn, 'QC Impact Assessment', 'Started', c.qia.assessedBy, '');
      const k = c.qia.categories || {};
      add(c.qia.completedOn, 'QC Impact Assessment', 'Completed', c.qia.assessedBy,
          [k.category, k.changeType, k.riskReq ? 'Further RA: ' + k.riskReq + (k.raNo ? ' (' + k.raNo + ')' : '') : ''].filter(Boolean).join(' · '));
    }
    if (c.plan) add(c.plan.submittedOn, 'Action Plan', 'Action items registered', c.plan.submittedBy,
                    (c.plan.items || []).map(x => x.no).join(', '));
    add(c.finalReturnedOn, 'Final Approval', 'Returned for correction → ' + (c.finalReturnTo || ''), c.finalReturnedBy, c.finalReturnComments);
    add(c.finalOn, 'Final Approval', c.finalDecision || 'Decision', c.finalBy, c.finalComments);
    c.acts.forEach(a => (a.history || []).forEach(h => add(h.on, 'Action Item', a.no + ': ' + (h.from || 'Open') + ' → ' + h.to, h.by,
      [h.newTarget ? 'Target ' + fmtDate(h.prevTarget) + ' → ' + fmtDate(h.newTarget) : '', h.completionDate && h.to === 'Completed' ? 'Completed ' + fmtDate(h.completionDate) : '', h.remarks, h.evidence ? 'Ref: ' + h.evidence : ''].filter(Boolean).join(' · '))));
    return E.sort((a, b) => (toDate(a.on) || 0) - (toDate(b.on) || 0));
  }


  /* ====== Track My CC: which CCs this user sees ======
     Initiator            → CCs they initiated
     Department Head      → CCs of their department (+ ones they initiated)
     Compliance Executive / QA Manager → every CC */
  const ME = (() => { try { return JSON.parse(sessionStorage.getItem('lina_user') || '{}'); } catch (_) { return {}; } })();
  const normDept = v => { const k = String(v || '').toLowerCase().replace(/&/g, ' and ').replace(/department|dept/g, '').replace(/[^a-z]/g, '');
    return ({ qc:'qualitycontrol', qa:'qualityassurance', rd:'researchanddevelopment', randd:'researchanddevelopment', it:'informationtechnology',
              hr:'humanresources', micro:'microbiology', admin:'administration', eng:'engineering' })[k] || k; };
  const SEE_ALL = ['Compliance Executive', 'QA Manager'].indexOf(ME.level) > -1;
  function mineCC(c){
    if (SEE_ALL) return true;
    const me = String(ME.username || ME.email || '').toLowerCase(), nm = String(ME.name || '').trim().toLowerCase();
    const own = (me && String(c.initiatedBy || '').toLowerCase() === me) || (nm && String(c.initiator || '').trim().toLowerCase() === nm);
    if (own) return true;
    return ME.level === 'Department Head' && !!ME.department && normDept(c.department || c.dept) === normDept(ME.department);
  }
  function scopeText(){
    return SEE_ALL ? 'Showing every change control (' + ME.level + ' view).'
      : ME.level === 'Department Head' ? (ME.department ? 'Showing change controls of ' + ME.department + ' and the ones you initiated.' : 'Your account has no department set: showing only the change controls you initiated.')
      : 'Showing the change controls you initiated.';
  }

  let DATA = null, STATE = 'active', OPEN = null;
  const bucket = c => c.steps.some(s => s.state === 'stop') ? 'stop' : c.steps.every(s => s.state === 'done') ? 'done' : 'active';
  function setState(s){ STATE = s; document.querySelectorAll('.tab[data-st]').forEach(t => t.classList.toggle('on', t.dataset.st === s)); render(); }

  async function load(){
    $('list').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    try {
      DATA = await loadQMS();
      DATA.ccs = DATA.ccs.filter(mineCC);
      $('scopeNote').textContent = scopeText();
      $('srcWarn').className = 'src-warn' + (DATA.failed.length ? ' show' : '');
      $('srcWarn').textContent = DATA.failed.length ? '⚠ Could not load: ' + DATA.failed.join(', ') + '. Some steps may show as not done.' : '';
      const depts = [...new Set(DATA.ccs.map(c => c.dept))].filter(d => d !== '—').sort();
      const cd = $('fDept').value, cs = $('fStep').value;
      $('fDept').innerHTML = '<option value="">All departments</option>' + depts.map(d => `<option${d === cd ? ' selected' : ''}>${esc(d)}</option>`).join('');
      const steps = ['Returned for correction'].concat(STEP_NAMES.slice(1, 7));
      $('fStep').innerHTML = '<option value="">Any step</option>' + steps.map(d => `<option${d === cs ? ' selected' : ''}>${esc(d)}</option>`).join('');
      render();
    } catch (err) {
      $('list').innerHTML = `<div class="state"><b>Could not load</b>${esc(err.message)}</div>`;
    }
  }

  function render(){
    if (!DATA) return;
    const q = $('fSearch').value.trim().toLowerCase(), dep = $('fDept').value, stp = $('fStep').value;
    const n = b => DATA.ccs.filter(c => bucket(c) === b).length;
    $('nActive').textContent = n('active'); $('nDone').textContent = n('done'); $('nStop').textContent = n('stop');
    const list = DATA.ccs.filter(c => bucket(c) === STATE && (!dep || c.dept === dep) && (!stp || stageText(c) === stp)
        && (!q || (c.ccNo + ' ' + (c.title || '')).toLowerCase().includes(q)))
      .sort((a, b) => a.ccNo < b.ccNo ? 1 : -1);
    if (!list.length){ $('list').innerHTML = '<div class="state"><b>No change controls</b>Nothing matches these filters.</div>'; return; }
    $('list').innerHTML = list.map(c => {
      const open = OPEN === c.ccNo, stage = stageText(c);
      const age = Math.max(0, Math.round((new Date() - (toDate(c.dateInitiated) || new Date())) / 864e5));
      return `<div class="pg ${open ? 'open' : ''}">
        <button class="pg-row" onclick="toggle('${esc(c.ccNo)}')" aria-expanded="${open}">
          <span class="pg-id"><b>${esc(c.ccNo)}</b><small>${fmtDate(c.dateInitiated)} · ${age} d</small></span>
          <span class="pg-ttl"><b>${esc(c.title || '')}</b><small>${esc(c.dept)}${c.initiator ? ' · ' + esc(c.initiator) : ''}</small></span>
          <span class="pg-steps">${c.steps.map((s, i) => `<i class="dot ${s.state}" title="${esc(s.name)}${s.date ? ' – ' + fmtDate(s.date) : ''}${s.note ? ' (' + esc(s.note) + ')' : ''}"></i>${i < c.steps.length - 1 ? `<i class="ln ${s.state === 'done' ? 'done' : ''}"></i>` : ''}`).join('')}</span>
          <span class="pg-stage ${bucket(c)}">${esc(stage)}</span>
          <span class="chev">${open ? '▴' : '▾'}</span>
        </button>
        ${open ? detail(c) : ''}
      </div>`; }).join('');
  }
  function toggle(cc){ OPEN = OPEN === cc ? null : cc; render(); }

  function detail(c){
    return `<div class="pg-detail">
      <div class="stepper">${c.steps.map(s => `<div class="st ${s.state}"><i></i><b>${esc(s.name)}</b><span>${s.date ? fmtDate(s.date) : s.state === 'current' ? 'In progress' : s.state === 'stop' ? 'Stopped' : '—'}</span>${s.note ? `<small>${esc(s.note)}</small>` : ''}</div>`).join('')}</div>
      <h3>History</h3>
      ${c.events.length ? `<ol class="tl">${c.events.map(e => `<li><span class="when">${fmtDT(e.on)}</span><span class="what"><b>${esc(e.module)}</b> – ${esc(e.action)}${e.by ? ` <span class="who">by ${esc(e.by)}</span>` : ''}${e.details ? `<small>${esc(e.details)}</small>` : ''}</span></li>`).join('')}</ol>` : '<p class="muted">No history recorded yet.</p>'}
      ${c.acts.length ? `<h3>Action items</h3><div class="acts">${c.acts.map(a => `<div><b>${esc(a.no)}</b> ${esc(a.description || '')}<span class="pill-s ${esc(a.status.replace(/\s/g, ''))}">${esc(a.status)}</span><small>${esc(a.responsible || '')}${a.target ? ' · target ' + fmtDate(a.target) : ''}</small></div>`).join('')}</div>` : ''}
    </div>`;
  }

  window.addEventListener('load', load);
</script>
</body>
</html>
